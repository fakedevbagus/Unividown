name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  WORKER_IMAGE: unividown-worker:${{ github.sha }}
  WEB_IMAGE: unividown-web:${{ github.sha }}

jobs:
  lint-test-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r services/worker/requirements.txt
      - name: Worker tests
        env:
          REDIS_URL: redis://localhost:6379/0
          REDIS_REQUIRED: 'true'
        run: cd services/worker && pytest -v
      - run: docker build -t "$WORKER_IMAGE" -f docker/Dockerfile.worker .
      - run: docker build -t "$WEB_IMAGE" -f docker/Dockerfile.web .
      - run: docker save "$WORKER_IMAGE" "$WEB_IMAGE" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz
          retention-days: 1

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint-test-build
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
      - run: gunzip -c images.tar.gz | docker load
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Scan built images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.WORKER_IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Scan web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.WEB_IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: '1'

# Deployment is intentionally not configured. Releases must not imply a deployment
# until VPS credentials, environment protection, and a rollback runbook exist.
