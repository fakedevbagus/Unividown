name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

env:
  WORKER_IMAGE: unividown-worker:${{ github.sha }}
  WEB_IMAGE: unividown-web:${{ github.sha }}

jobs:
  lint-test-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r services/worker/requirements.txt
      - name: Worker tests
        env:
          REDIS_URL: redis://localhost:6379/0
          REDIS_REQUIRED: 'true'
        run: cd services/worker && pytest -v
      - run: docker build -t "$WORKER_IMAGE" -f docker/Dockerfile.worker .
      - name: Inventory worker Python packages
        run: |
          inventory=$(docker run --rm "$WORKER_IMAGE" python -c "import glob, importlib.metadata as m; names=['msgpack','setuptools']; print('; '.join(f'{name}={next((d.version for d in m.distributions() if d.metadata.get(\"Name\",\"\").lower()==name),\"absent\")}' for name in names)); print('metadata=' + ','.join(glob.glob('/usr/local/lib/python3.11/site-packages/*msgpack*') + glob.glob('/usr/local/lib/python3.11/site-packages/*setuptools*') + glob.glob('/usr/local/lib/python3.11/ensurepip/_bundled/*')))" | tr '\n' ' ')
          echo "::notice title=Worker Python package inventory::$inventory"
      - run: docker build -t "$WEB_IMAGE" -f docker/Dockerfile.web .
      - name: Validate Compose and run development smoke test
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
          trap 'docker compose -f docker-compose.dev.yml down -v' EXIT
          docker compose -f docker-compose.dev.yml up -d --build --wait
          curl -fsS http://localhost:8000/api/health/live
          curl -fsS http://localhost:8000/api/health/ready
          curl -fsS http://localhost:8000/metrics | grep -q http_requests_total
          curl -fsS 'http://localhost:8000/socket.io/?EIO=4&transport=polling' | grep -q '^0{'
          curl -fsS http://localhost:3000 >/dev/null
      - run: docker save "$WORKER_IMAGE" "$WEB_IMAGE" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz
          retention-days: 1

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint-test-build
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-images
      - run: gunzip -c images.tar.gz | docker load
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Scan worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.WORKER_IMAGE }}
          format: json
          output: worker-trivy.json
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Scan web image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.WEB_IMAGE }}
          format: json
          output: web-trivy.json
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Enforce image vulnerability policy
        run: python scripts/enforce_trivy_policy.py security/trivy-exceptions.json worker=worker-trivy.json web=web-trivy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-reports
          path: '*-trivy.json'
          retention-days: 7

# Deployment is intentionally not configured. Releases must not imply a deployment
# until VPS credentials, environment protection, and a rollback runbook exist.
